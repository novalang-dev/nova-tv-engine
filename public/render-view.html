<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Nova TV Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { margin: 0; padding: 0; background: transparent; font-family: 'Arial', sans-serif; overflow: hidden; color: white; }
    
    /* Top Skor Barı */
    .scoreboard { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 20px; border-left: 5px solid #e74c3c; display: none; }
    
    /* 15 Saniyede Bir Dönen İstatistik Kutusu */
    .stats-box { position: absolute; bottom: 30px; right: 30px; background: rgba(15, 23, 42, 0.9); padding: 15px; border-radius: 10px; width: 280px; border: 1px solid #334155; transition: all 0.5s ease; display: none; }
    
    /* Patlayan Gol Efekti Katmanı */
    .goal-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(231, 76, 60, 0.85); display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <!-- Skorbord -->
  <div id="scoreboard" class="scoreboard">
    TRABZONSPOR <span id="scoreText">0 - 0</span> RAKİP | <span id="timeText">00:00</span>
  </div>

  <!-- 15 Saniyede Bir Değişen Kutusu -->
  <div id="statsBox" class="stats-box">
    <div id="statsTitle" style="color: #38bdf8; font-size: 14px; margin-bottom: 5px;">CANLI İSTATİSTİK</div>
    <div id="statsContent" style="font-size: 16px;">Topla Oynama: %55 - %45</div>
  </div>

  <!-- Olay Efekti Katmanı -->
  <div id="effectLayer"></div>

  <script>
    const socket = io();

    // 15 Saniyede Bir Dönen Veri Seti
    const statsCarousel = [
      { title: "CANLI İSTATİSTİK", content: "Topla Oynama: %58 - %42 | Şut: 9 - 3" },
      { title: "İLK 11 KADROLARI", content: "TS: Uğurcan, Savic, Denswil, Visca..." },
      { title: "CANLI PUAN DURUMU", content: "1. Trabzonspor - 48 P | 2. Rakip - 45 P" }
    ];
    let currentIndex = 0;

    // 15 Saniyede Bir Kutuyu Güncelle
    setInterval(() => {
      currentIndex = (currentIndex + 1) % statsCarousel.length;
      document.getElementById('statsTitle').innerText = statsCarousel[currentIndex].title;
      document.getElementById('statsContent').innerText = statsCarousel[currentIndex].content;
    }, 15000);

    // Rejiden Gelen Sinyalleri Dinle
    socket.on('stateUpdate', (state) => {
      if(state.activeMode === 'football') {
        document.getElementById('scoreboard').style.display = 'block';
        document.getElementById('statsBox').style.display = 'block';
      } else {
        document.getElementById('scoreboard').style.display = 'none';
        document.getElementById('statsBox').style.display = 'none';
      }

      document.getElementById('scoreText').innerText = `${state.score.home} - ${state.score.away}`;

      const effectLayer = document.getElementById('effectLayer');
      if(state.activeEffect === 'GOL') {
        effectLayer.innerHTML = '<div class="goal-overlay">⚽ GOOOOOOL!</div>';
      } else {
        effectLayer.innerHTML = '';
      }
    });
  </script>
</body>
</html>
